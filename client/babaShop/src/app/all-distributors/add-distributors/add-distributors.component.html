<div class="main-content">
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header card-header-danger">
                    <h4 class="card-title">{{ isEditMode ? 'Edit Distributor' : 'Add Distributor' }}</h4>
                </div>
                <div class="card-body">

                    <form [formGroup]="distributorForm" (ngSubmit)="onSubmit()">
                        <!-- Shop (Super Admin Only) -->
                        <div class="row" *ngIf="isSuperAdmin">
                            <div class="col-md-12">
                                <mat-form-field class="example-full-width">
                                    <mat-label>Select Shop</mat-label>
                                    <mat-select formControlName="shop">
                                        <mat-option *ngFor="let shop of shops" [value]="shop._id">
                                            {{ shop.name }} ({{ shop.shopCode }})
                                        </mat-option>
                                    </mat-select>
                                </mat-form-field>
                            </div>
                        </div>

                        <!-- Distributor Name -->
                        <div class="row">
                            <div class="col-md-12">
                                <mat-form-field class="example-full-width">
                                    <input matInput placeholder="Distributor Name" name="name" formControlName="name"
                                        required>
                                </mat-form-field>
                            </div>
                        </div>


                        <div class="row">
                            <div class="col-md-12">
                                <mat-form-field class="example-full-width">
                                    <input matInput placeholder="Email" name="email" formControlName="email"
                                        type="email" required>
                                </mat-form-field>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-12">
                                <mat-form-field class="example-full-width">
                                    <input matInput placeholder="Phone Numbers" name="phone" pattern="[6-9][0-9]{9}"
                                        formControlName="phone" required>
                                </mat-form-field>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-12">
                                <mat-form-field class="example-full-width">
                                    <input matInput placeholder="Telephone Numbers" name="telephone"
                                        pattern="[6-9][0-9]{9}" formControlName="telephone">
                                </mat-form-field>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-12">
                                <mat-form-field class="example-full-width">
                                    <input matInput placeholder="Address" name="address" formControlName="addressLine1">
                                </mat-form-field>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-12">
                                <mat-form-field class="example-full-width">
                                    <input matInput placeholder="Address Line 2" name="addressLine2"
                                        formControlName="addressLine2">
                                </mat-form-field>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-12">
                                <mat-form-field class="example-full-width">
                                    <input matInput placeholder="City" name="city" formControlName="city">
                                </mat-form-field>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-12">
                                <mat-form-field class="example-full-width">
                                    <input matInput placeholder="State" name="state" formControlName="state">
                                </mat-form-field>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-12">
                                <mat-form-field class="example-full-width">
                                    <input matInput placeholder="District" name="district" formControlName="district">
                                </mat-form-field>
                            </div>
                        </div>


                        <div class="row">
                            <div class="col-md-12">
                                <mat-form-field class="example-full-width">
                                    <input matInput placeholder="Pincode" name="pincode" formControlName="pincode">
                                </mat-form-field>
                            </div>
                        </div>



                        <div class="row">
                            <div class="col-md-12">
                                <mat-form-field>
                                    <input matInput placeholder="Distributor GST" name="gstNumber"
                                        formControlName="gstNumber">
                                </mat-form-field>
                            </div>
                        </div>

                        <div class="row" *ngIf="!isEditMode">
                            <div class="col-md-12">
                                <mat-form-field>
                                    <input matInput placeholder="Opening Balance" name="openingBalance" type="number"
                                        formControlName="openingBalance">
                                </mat-form-field>
                            </div>
                        </div>


                        <div class="row" *ngIf="!isEditMode">
                            <div class="col-md-12">
                                <mat-form-field>
                                    <input matInput placeholder="Credit Limit" name="creditLimit" type="number"
                                        formControlName="creditLimit">
                                </mat-form-field>
                            </div>
                        </div>


                        <div class="row" *ngIf="!isEditMode">
                            <div class="col-md-12">
                                <mat-form-field>
                                    <input matInput placeholder="Payment Terms (Days)" name="paymentTerms" type="number"
                                        formControlName="paymentTerms">
                                </mat-form-field>
                            </div>
                        </div>
















                        <!-- Submit Button -->
                        <button mat-raised-button type="submit" class="btn btn-danger pull-right"
                            [disabled]="distributorForm.invalid || isSubmitting">

                            {{ isEditMode ? 'Update Distributor' : 'Add Distributor' }}
                        </button>

                        <div class="clearfix"></div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
