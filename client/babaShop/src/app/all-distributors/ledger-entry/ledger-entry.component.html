<h2 mat-dialog-title>
  {{ type | titlecase }} Entry
</h2>

<mat-dialog-content>

  <form [formGroup]="form" class="ledger-form">

    <!-- Amount -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Amount</mat-label>
      <input matInput type="number" formControlName="amount">
      <mat-error *ngIf="form.get('amount')?.hasError('required')">
        Amount is required
      </mat-error>
    </mat-form-field>

    <!-- Payment Mode (only for payment) -->
    <mat-form-field *ngIf="type === 'payment'"
      appearance="outline"
      class="full-width">
      <mat-label>Payment Mode</mat-label>
      <mat-select formControlName="paymentMode">
        <mat-option *ngFor="let m of paymentModes" [value]="m">
          {{ m }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('paymentMode')?.hasError('required')">
        Payment mode required
      </mat-error>
    </mat-form-field>

    <mat-form-field *ngIf="type === 'payment'" appearance="outline" class="full-width">
      <mat-label>Against Purchase (Optional)</mat-label>
      <mat-select formControlName="referenceId">
        <mat-option value="">General Payment</mat-option>
        <mat-option *ngFor="let p of purchaseOptions" [value]="p._id">
          {{ p.invoiceNo || p._id }} | Due ₹{{ p.dueAmount | number:'1.2-2' }}
        </mat-option>
      </mat-select>
      <mat-hint *ngIf="!purchaseOptions.length">
        No pending confirmed purchase found for this distributor
      </mat-hint>
    </mat-form-field>

    <!-- Note -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Note</mat-label>
      <textarea matInput rows="3" formControlName="note"></textarea>
    </mat-form-field>

  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>

  <button mat-raised-button
          color="primary"
          (click)="submit()"
          [disabled]="!canSubmit || form.invalid || loading">

    {{ loading ? 'Saving...' : 'Save' }}

  </button>
</mat-dialog-actions>
