<div class="main-content">
  <div class="card">
    <div class="card-header card-header-danger">
      <h4 class="card-title">Add Category</h4>
    </div>

    <div class="card-body">
      <form (ngSubmit)="onSubmit()" #categoryForm="ngForm">

        <mat-form-field class="example-full-width">
          <input matInput placeholder="Category Name" name="name" [(ngModel)]="name" required />
        </mat-form-field>

        <mat-form-field class="example-full-width">
          <textarea matInput placeholder="Category Description" name="description" [(ngModel)]="description">
          </textarea>
        </mat-form-field>

        <button mat-raised-button type="submit" class="btn btn-danger" [disabled]="!categoryForm.valid || isLoading">

          {{ isEditMode ? 'Update Category' : 'Add Category' }}

        </button>

      </form>
    </div>
  </div>
</div>
