<div class="modal-container">
  <div class="modal-header">
    <div class="header-content">
      <mat-icon>{{ isEditMode ? 'edit' : 'add_circle' }}</mat-icon>
      <div>
        <div class="header-title">{{ isEditMode ? 'UPDATE PRODUCT' : 'ADD PRODUCT' }}</div>
        <div class="header-sub">Create base product before adding variations</div>
      </div>
    </div>
    <button mat-icon-button (click)="cancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="modal-body">
    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Product Name *</mat-label>
        <input matInput [(ngModel)]="product.name" appCapitalizeFirst required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Select Category</mat-label>
        <mat-select [(ngModel)]="product.category" name="category" required (selectionChange)="onCategoryChange()">
          <mat-option *ngFor="let cat of categories" [value]="cat._id">
            {{ cat.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Select Brand</mat-label>
        <mat-select [(ngModel)]="product.brand" name="brand" required [disabled]="!product.category">
          <mat-option *ngFor="let b of filteredBrands" [value]="b._id">
            {{ b.name }}
          </mat-option>
        </mat-select>
        <mat-hint *ngIf="product.category && !filteredBrands.length">
          No brands mapped to this category
        </mat-hint>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description</mat-label>
        <textarea matInput rows="3" [(ngModel)]="product.description" appCapitalizeFirst></textarea>
        <button mat-icon-button matSuffix type="button" (click)="generateDescription()" [disabled]="generating" matTooltip="Generate AI Description">
          <mat-icon>{{ generating ? 'hourglass_top' : 'auto_awesome' }}</mat-icon>
        </button>
      </mat-form-field>
    </div>
  </div>

  <div class="modal-footer">
    <button mat-stroked-button color="warn" type="button" (click)="cancel()">
      Cancel
    </button>
    <button mat-raised-button color="primary" (click)="saveProduct()" [disabled]="isLoading">
      <mat-icon>{{ isLoading ? 'hourglass_top' : 'save' }}</mat-icon>
      {{ isLoading ? (isEditMode ? 'Updating...' : 'Saving...') : (isEditMode ? 'Update Product' : 'Save & Add Variations') }}
    </button>
  </div>
</div>
