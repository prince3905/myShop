<nav class="navbar navbar-expand-lg navbar-transparent  navbar-absolute fixed-top">
    <div class="container-fluid">
        <div class="navbar-wrapper">
            <a class="navbar-brand" href="javascript:void(0)">{{getTitle()}}</a>
        </div>
        <button mat-raised-button class="navbar-toggler" type="button" (click)="sidebarToggle()">
            <span class="sr-only">Toggle navigation</span>
            <span class="navbar-toggler-icon icon-bar"></span>
            <span class="navbar-toggler-icon icon-bar"></span>
            <span class="navbar-toggler-icon icon-bar"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navigation">
            <div class="shop-chip">
                <span class="shop-chip-label">Current Shop:</span>
                <span class="shop-chip-value">{{ getCurrentShopLabel() }}</span>
            </div>

            <ul class="navbar-nav align-items-center">
                <li class="nav-item dropdown" *ngIf="isSuperAdmin">
                    <a class="nav-link shop-count-link" href="javascript:void(0)" [matMenuTriggerFor]="shopsMenu">
                        <i class="material-icons">store</i>
                        <span class="shop-count-label">Shops</span>
                        <span class="shop-count-badge">{{ shops.length }}</span>
                    </a>
                    <mat-menu #shopsMenu="matMenu">
                        <button mat-menu-item (click)="clearShopSelection()">
                            <i class="material-icons">public</i>
                            <span>All Shops (Global)</span>
                        </button>
                        <button mat-menu-item (click)="navigateTo('/shops')">
                            <i class="material-icons">add_business</i>
                            <span>Add Shop</span>
                        </button>
                        <button mat-menu-item disabled>
                            <i class="material-icons">sync_alt</i>
                            <span>Switch Shop</span>
                        </button>
                        <button mat-menu-item *ngFor="let shop of shops" (click)="onShopChange(shop._id)">
                            <i class="material-icons">storefront</i>
                            <span>{{ shop.name }} ({{ shop.shopCode }})</span>
                        </button>
                    </mat-menu>
                </li>

                <li class="nav-item" *ngFor="let link of navLinks">
                    <a class="nav-link quick-link" href="javascript:void(0)" (click)="navigateTo(link.path)">
                        <i class="material-icons">{{ link.icon }}</i>
                        <span class="quick-link-text">{{ link.title }}</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
