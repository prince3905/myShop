<div class="sidebar-wrapper">

  <!-- Logo -->
  <div class="logo">
    <a routerLink="/" class="simple-text">
      <div class="logo-img">
        <img src="/assets/img/logo.png" />
      </div>
    </a>
  </div>

  <!-- Menu -->
  <ul class="nav">
    <li *ngFor="let menuItem of menuItems" class="nav-item">

      <!-- Simple Link -->
      <a *ngIf="!menuItem.children" class="nav-link" routerLinkActive="active" [routerLink]="[menuItem.path]">

        <i class="material-icons">{{menuItem.icon}}</i>
        <p *ngIf="!isCollapsed">{{menuItem.title}}</p>
      </a>

      <!-- Dropdown -->
      <a *ngIf="menuItem.children" class="nav-link" (click)="toggleMenu(menuItem)">

        <i class="material-icons">{{menuItem.icon}}</i>
        <p *ngIf="!isCollapsed">
          {{menuItem.title}}
          <b class="caret"></b>
        </p>
      </a>

      <ul *ngIf="menuItem.children && menuItem.expanded" class="nav child-menu">
        <li *ngFor="let child of menuItem.children" routerLinkActive="active" class="nav-item">

          <a class="nav-link" [routerLink]="[child.path]">

            <i class="material-icons">{{child.icon}}</i>
            <p *ngIf="!isCollapsed">{{child.title}}</p>
          </a>

        </li>
      </ul>

    </li>

    <!-- Logout -->
    <li class="nav-item logout-item">
      <a class="nav-link" (click)="logout()">
        <i class="material-icons">logout</i>
        <p *ngIf="!isCollapsed">Logout</p>
      </a>
    </li>

  </ul>

</div>
