<h2 mat-dialog-title>Collect Payment</h2>

<mat-dialog-content>
  <div class="meta">
    <div>Invoice: <strong>{{ data?.sale?.invoiceNo || data?.sale?._id }}</strong></div>
    <div>Customer: <strong>{{ data?.sale?.customerName || 'Walk-in' }}</strong></div>
    <div>Outstanding Due: <strong>Rs {{ dueAmount | number:'1.2-2' }}</strong></div>
  </div>

  <form [formGroup]="form" class="form-wrap">
    <mat-form-field appearance="outline">
      <mat-label>Amount</mat-label>
      <input matInput type="number" formControlName="amount" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Payment Method</mat-label>
      <mat-select formControlName="paymentMethod">
        <mat-option *ngFor="let method of methods" [value]="method">{{ method }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Note (optional)</mat-label>
      <input matInput formControlName="note" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" type="button" [disabled]="saving" (click)="submit()">
    {{ saving ? "Saving..." : "Collect Payment" }}
  </button>
</mat-dialog-actions>
