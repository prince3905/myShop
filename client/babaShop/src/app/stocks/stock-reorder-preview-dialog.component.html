<h2 mat-dialog-title>Bulk Reorder Preview</h2>

<mat-dialog-content>
  <div class="summary-row">
    <span class="chip">Rows: {{ rows.length }}</span>
    <span class="chip">Selected: {{ selectedCount }}</span>
    <span class="chip">Total Qty: {{ totalQty }}</span>
    <button mat-stroked-button color="primary" type="button" (click)="toggleAll(true)">Select All</button>
    <button mat-stroked-button color="warn" type="button" (click)="toggleAll(false)">Clear All</button>
  </div>

  <div class="table-responsive">
    <table class="table table-sm reorder-table">
      <thead>
        <tr>
          <th>Select</th>
          <th>Product</th>
          <th>Model</th>
          <th>SKU</th>
          <th>Current</th>
          <th>Reorder</th>
          <th>Draft Qty</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of rows">
          <td>
            <mat-checkbox [(ngModel)]="row.selected"></mat-checkbox>
          </td>
          <td>{{ row.productName }}</td>
          <td>{{ row.modelName }}</td>
          <td>{{ row.sku }}</td>
          <td>{{ row.currentQty }}</td>
          <td>{{ row.reorderLevel }}</td>
          <td>
            <mat-form-field appearance="outline" class="qty-field">
              <input matInput type="number" [(ngModel)]="row.suggestedQty" min="1" />
            </mat-form-field>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()">Cancel</button>
  <button mat-raised-button color="primary" type="button" (click)="confirm()" [disabled]="selectedCount === 0">
    Create Drafts
  </button>
</mat-dialog-actions>
